<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Best Price Pill Effect</title>
        <style>
            body {
                margin: 0;
                padding: 48px;
                background: #1a1a1a;
                font-family: system-ui, sans-serif;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 24px;
            }

            /* Demo container: mimics the checkout radio option label */
            .option {
                position: relative;
                width: 260px;
                padding: 16px;
                background: rgba(255, 255, 255, 0.05);
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 12px;
                cursor: pointer;
                transition: background 0.2s;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .option:hover {
                background: rgba(255, 255, 255, 0.1);
            }

            .option label.text {
                color: #fff;
                font-size: 14px;
                font-weight: 500;
            }
            .option .cost {
                color: #22c55e;
                font-size: 14px;
                font-weight: 600;
            }

            /* The pill: absolutely positioned top-right of the option */
            .best-price-pill {
                position: absolute;
                top: -6px;
                right: 0;
                z-index: 10;
                background: #22c55e;
                color: #000;
                font-size: 10px;
                font-weight: 600;
                padding: 2px 8px;
                border-radius: 9999px;
                white-space: nowrap;
                letter-spacing: 0.025em;
                animation: bestPricePop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            }

            @keyframes bestPricePop {
                0% {
                    transform: scale(0);
                    opacity: 0;
                }
                15% {
                    transform: scale(1.35);
                }
                30% {
                    transform: scale(0.9);
                }
                45% {
                    transform: scale(1.2);
                }
                60% {
                    transform: scale(1);
                    opacity: 1;
                }
            }

            button {
                padding: 10px 18px;
                border: none;
                border-radius: 8px;
                background: #22c55e;
                color: #000;
                font-weight: 600;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <div class="option" id="option">
            <span class="text">Standard Shipping</span>
            <span class="cost">$5.00</span>
            <span class="best-price-pill">Best price</span>
        </div>

        <button id="replay">Replay</button>

        <script>
            const PARTICLE_COLORS = ["#22c55e", "#4ade80", "#86efac", "#16a34a"];

            // Existing pill instance: fire particles on load
            const pill = document.querySelector(".best-price-pill");
            burst(pill);

            // Replay: re-run the CSS animation + particle burst
            document.getElementById("replay").addEventListener("click", () => {
                pill.style.animation = "none";
                void pill.offsetWidth; // force reflow to restart CSS animation
                pill.style.animation = "";
                burst(pill);
            });

            function burst(el) {
                const rect = el.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const count = 10;
                const nodes = [];

                for (let i = 0; i < count; i++) {
                    const dot = document.createElement("span");
                    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
                    const distance = 24 + Math.random() * 28;
                    const tx = Math.cos(angle) * distance;
                    const ty = Math.sin(angle) * distance - 8;

                    dot.style.position = "fixed";
                    dot.style.left = `${cx}px`;
                    dot.style.top = `${cy}px`;
                    dot.style.width = "6px";
                    dot.style.height = "6px";
                    dot.style.borderRadius = "50%";
                    dot.style.pointerEvents = "none";
                    dot.style.zIndex = "9999";
                    dot.style.background = PARTICLE_COLORS[i % PARTICLE_COLORS.length];

                    dot.animate(
                        [
                            { opacity: 1, transform: "translate(0, 0) scale(1)" },
                            { opacity: 0, transform: `translate(${tx}px, ${ty}px) scale(0)` },
                        ],
                        { duration: 700, easing: "ease-out", fill: "forwards" },
                    );

                    document.body.appendChild(dot);
                    nodes.push(dot);
                }

                setTimeout(() => nodes.forEach((n) => n.parentNode.removeChild(n)), 700);
            }
        </script>
    </body>
</html>
